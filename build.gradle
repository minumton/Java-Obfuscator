plugins {
    id 'java'
    id 'application'
}

group = 'ru.sut'
version = '1.0'

repositories {
    mavenCentral()
}

ext {
    javaParserVersion = '3.28.2'
    log4jVersion = '2.26.1'
    junitVersion = '5.14.4'
    javafxVersion = '21.0.13'
    javafxModules = ['base', 'graphics', 'controls']
    // Нативные части JavaFX для трёх ОС, чтобы один jar запускался везде.
    javafxPlatforms = ['win', 'linux', 'mac-aarch64']
}

dependencies {
    implementation "com.github.javaparser:javaparser-symbol-solver-core:${javaParserVersion}"
    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"

    javafxModules.each { module ->
        javafxPlatforms.each { platform ->
            implementation "org.openjfx:javafx-${module}:${javafxVersion}:${platform}"
        }
    }

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'ru.sut.obfuscator.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnitPlatform()
}

javadoc {
    destinationDir = file('docs/javadoc')
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.memberLevel = JavadocMemberLevel.PRIVATE
    // Документируются классы и методы; для полей-констант комментарий не обязателен.
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

// Исполняемый jar со всеми зависимостями: java -jar build/libs/java-obfuscator.jar
jar {
    archiveFileName = 'java-obfuscator.jar'
    manifest {
        attributes 'Main-Class': application.mainClass.get(),
                'Multi-Release': 'true'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', '**/module-info.class'
}
